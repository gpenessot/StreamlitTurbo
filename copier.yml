# StreamlitTurbo - Template Streamlit (version lead magnet)
# Version complete : https://www.mes-formations-data.fr/formation/streamlit-unleashed

_min_copier_version: "9.0.0"
_templates_suffix: .jinja
_subdirectory: template

project_name:
  type: str
  help: "Nom de votre projet Streamlit"
  placeholder: "Mon Super Dashboard"

project_slug:
  type: str
  help: "Nom technique du projet (sans espaces ni caracteres speciaux)"
  placeholder: "mon_super_dashboard"
  validator: "{% if not project_slug.replace('_', '').isalnum() %}Le nom technique doit contenir uniquement des lettres, chiffres et underscores (pas de tirets){% endif %}"

project_description:
  type: str
  help: "Description courte de votre projet"
  placeholder: "Une application Streamlit moderne et intuitive"

author_name:
  type: str
  help: "Votre nom complet"
  placeholder: "Jean Dupont"

author_email:
  type: str
  help: "Votre email"
  placeholder: "jean.dupont@example.com"
  validator: "{% if '@' not in author_email %}Veuillez entrer un email valide{% endif %}"

python_version:
  type: str
  help: "Version Python minimale"
  default: "3.12"
  choices:
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"

streamlit_theme:
  type: str
  help: "Theme par defaut de l'interface"
  default: "dark"
  choices:
    Dark (Spotify style): "dark"
    Light (Eclair style): "light"
    Blue (Corporate): "blue"
    Green (Nature): "green"

_message_after_copy: |

  Votre projet Streamlit a ete cree avec succes !

    Projet     : {{ project_name }}
    Repertoire : {{ project_slug }}

  Prochaines etapes (avec uv + just) :
    1. cd {{ project_slug }}
    2. just setup
    3. just run

  Sans just :
    1. cd {{ project_slug }}
    2. pip install -r requirements.txt
    3. streamlit run main.py

  Ce template demo montre les bonnes pratiques Streamlit de base.
  Pour la version complete (tests, CI/CD, deploiement, authentification,
  connecteurs base de donnees, monitoring) :

    https://www.mes-formations-data.fr/formation/streamlit-unleashed

  Besoin d'aide ? Consultez le README.md genere.
